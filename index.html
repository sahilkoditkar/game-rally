<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#24252d">
  <meta name="description" content="Dustline: a pocket rally. Low-poly time-trial stages in the browser.">
  <title>Dustline</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324252d'/%3E%3Cpath d='M6 22 L14 9 L19 9 L11 22Z' fill='%23e2472f'/%3E%3Cpath d='M15 22 L23 9 L27 9 L19 22Z' fill='%23f2b632'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app"></div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden" aria-hidden="true">
    <!-- one .pane per player is generated by main.js (timer, gap, progress, speed plate, notices) -->
    <div id="panes"></div>
    <div id="divider" class="divider hidden"></div>
    <div class="hud-bl" id="hints">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> gas / brake</span>
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> steer</span>
      <span><kbd>Space</kbd> handbrake</span>
      <span><kbd>R</kbd> reset <kbd>C</kbd> camera <kbd>Esc</kbd> pause</span>
    </div>
    <button class="icon-btn pause-btn" id="pauseBtn" aria-label="Pause"><span></span><span></span></button>
  </div>

  <div id="countdown" class="countdown"></div>

  <!-- ===== Touch controls ===== -->
  <div id="touch" class="touch hidden">
    <div class="t-left">
      <button class="t-btn t-steer" data-ctl="left" aria-label="Steer left">&#9664;</button>
      <button class="t-btn t-steer" data-ctl="right" aria-label="Steer right">&#9654;</button>
    </div>
    <div class="t-right">
      <div class="t-small">
        <button class="t-btn t-mini" data-ctl="reset" aria-label="Reset">RESET</button>
        <button class="t-btn t-mini" data-ctl="hand" aria-label="Handbrake">HAND</button>
      </div>
      <button class="t-btn t-brake" data-ctl="brake">BRAKE</button>
      <button class="t-btn t-gas" data-ctl="gas">GAS</button>
    </div>
  </div>

  <!-- ===== Menu ===== -->
  <div id="menu" class="menu hidden">
    <div class="menu-panel">
      <!-- top bar: logo, medal points, credits (the only place in the menu), settings -->
      <header class="topbar">
        <div class="logo"><span class="logo-slash"></span><span class="logo-word">DUSTLINE</span></div>
        <div class="points" id="points" title="Medal points: bronze 1, silver 2, gold 3, ace 4 per stage (the Daily Stage does not count)"></div>
        <div class="cr-chip" id="credits" title="Credits: earned by finishing solo stages, spent in the Garage"></div>
        <button class="icon-btn gear-btn" id="gearBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2h3.4l.5 2.6a7.6 7.6 0 0 1 1.9 1.1l2.5-.9 1.7 2.9-2 1.7a7.7 7.7 0 0 1 0 2.2l2 1.7-1.7 2.9-2.5-.9a7.6 7.6 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.6 7.6 0 0 1-1.9-1.1l-2.5.9-1.7-2.9 2-1.7a7.7 7.7 0 0 1 0-2.2l-2-1.7 1.7-2.9 2.5.9a7.6 7.6 0 0 1 1.9-1.1zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" fill="currentColor" fill-rule="evenodd"/></svg></button>
      </header>

      <!-- the sheet: everything below the top bar (a bottom sheet on phones, so the car stays visible) -->
      <div class="menu-body" id="menuBody">
        <div class="nav-row">
          <div class="ptabs" role="tablist" aria-label="Menu view">
            <button class="ptab view-btn" data-view="play" role="tab">Play</button>
            <button class="ptab view-btn" data-view="garage" role="tab">Garage<span class="new-dot dot hidden" id="garageNew" title="Something affordable"></span></button>
          </div>
          <div class="seg mode-seg" id="modeSeg" role="radiogroup" aria-label="Mode">
            <button class="seg-btn" data-mode="solo" role="radio">Solo</button>
            <button class="seg-btn" data-mode="duel" role="radio">Duel</button>
          </div>
        </div>
        <div class="mode-note" id="modeNote"></div>

        <!-- garage: tune and style the Rook (rendered by garage.js) -->
        <section class="menu-sec garage-sec hidden" id="garageSec"></section>

        <section class="menu-sec stages-sec" id="stagesSec">
          <div class="tabs" id="regionTabs" role="tablist" aria-label="Regions"></div>
          <div class="list-head" id="listHead"></div>
          <div class="cards" id="cards"></div>
        </section>

        <!-- pinned to the bottom of the scrolling sheet: START names what it starts -->
        <div class="menu-foot">
          <button class="btn primary big start-btn" id="startBtn">Start</button>
        </div>
      </div>
      <div class="notice alt menu-toast" id="menuToast"></div>
    </div>
  </div>

  <!-- ===== Pause ===== -->
  <div id="pause" class="overlay hidden">
    <div class="panel small">
      <div class="panel-kicker" id="pauseKicker">Paused</div>
      <div class="panel-title" id="pauseStage">Stage</div>
      <div class="panel-btns col">
        <button class="btn primary" id="resumeBtn">Resume<span class="btn-key">Esc</span></button>
        <button class="btn" id="restartBtn">Restart</button>
        <button class="btn" id="pSettingsBtn">Settings</button>
        <button class="btn ghost" id="pMenuBtn">Quit to menu</button>
      </div>
    </div>
  </div>

  <!-- ===== Finish ===== -->
  <div id="finish" class="overlay hidden">
    <div class="panel">
      <div class="panel-kicker" id="finStage">Stage</div>
      <div class="fin-time" id="finTime">0:00.000</div>
      <div class="fin-best" id="finBest"></div>
      <div class="fin-pen" id="finPen"></div>
      <div class="fin-medal" id="finMedal"></div>
      <div class="fin-earn" id="finEarn"></div>
      <table class="splits" id="finSplits"></table>
      <div class="panel-btns res-btns">
        <button class="btn primary" id="retryBtn">Retry<span class="btn-key">Enter</span></button>
        <button class="btn" id="nextBtn">Next<span class="btn-key">N</span></button>
        <button class="btn ghost wide" id="fMenuBtn">Menu<span class="btn-key">Esc</span></button>
      </div>
    </div>
  </div>

  <!-- ===== Duel results ===== -->
  <div id="duelFinish" class="overlay hidden">
    <div class="panel duel-panel">
      <div class="panel-kicker" id="dfStage">Duel</div>
      <div class="winner" id="dfWinner"></div>
      <div class="df-gap" id="dfGap"></div>
      <table class="splits duel-splits" id="dfTable"></table>
      <div class="panel-btns res-btns">
        <button class="btn primary" id="dfRematch">Rematch<span class="btn-key">Enter</span></button>
        <button class="btn" id="dfNext">Next<span class="btn-key">N</span></button>
        <button class="btn ghost wide" id="dfMenu">Menu<span class="btn-key">Esc</span></button>
      </div>
    </div>
  </div>

  <!-- ===== Rally interstitial / results (content rendered by hud.js) ===== -->
  <div id="rally" class="overlay hidden">
    <div class="panel rally-panel" id="rallyBody"></div>
  </div>

  <!-- ===== Settings (gear, Esc in PLAY, pad Y, Pause > Settings) ===== -->
  <div id="settings" class="overlay hidden">
    <div class="panel small settings-panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
      <div class="set-head"><div class="panel-title" id="setTitle">Settings</div><button class="x-btn" data-act="close" aria-label="Close settings">&times;</button></div>
      <div class="set-rows" id="setRows"></div>
      <div class="set-foot"><button class="btn primary set-done" data-act="close" data-nav data-row="done">Done<span class="btn-key">Esc</span></button></div>
    </div>
  </div>

  <div id="loading" class="loading"><div class="loading-bar"></div><span>Laying gravel&hellip;</span></div>

  <noscript><p class="noscript">Dustline needs JavaScript and WebGL.</p></noscript>

  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
