<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Handling Lab</title>
<style>
  :root {
    --panel: rgba(18, 22, 28, 0.82);
    --panel-solid: #161b22;
    --text: #eef2f6;
    --muted: #9aa7b4;
    --accent: #ffb020;
    --accent2: #4cc2ff;
    --danger: #ff5a4f;
    --btn: rgba(255, 255, 255, 0.16);
    --btn-on: rgba(255, 176, 32, 0.55);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #8fb3c9; color: var(--text);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; pointer-events: none; z-index: 2; }
  #hudL { top: calc(8px + var(--sat)); left: calc(8px + var(--sal)); background: var(--panel); border-radius: 10px; padding: 8px 12px; min-width: 150px; }
  #speed { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #speed small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .row span:first-child { color: var(--muted); }
  #slipbar { height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; margin-top: 5px; position: relative; overflow: hidden; }
  #slipfill { position: absolute; top: 0; bottom: 0; left: 50%; background: var(--accent2); }
  #driftTag { display: inline-block; margin-top: 4px; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: #111; font-weight: 700; font-size: 12px; visibility: hidden; }
  #offTag { display: inline-block; margin-top: 4px; margin-left: 4px; padding: 1px 6px; border-radius: 4px; background: var(--danger); color: #fff; font-weight: 700; font-size: 12px; visibility: hidden; }
  #bar { position: fixed; z-index: 3; top: calc(8px + var(--sat)); right: calc(8px + var(--sar)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 60vw; }
  #bar select, #bar button, #tune button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 6px 9px; min-height: 34px; }
  #bar button.on { background: var(--btn-on); }
  #touch { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 calc(10px + var(--sar)) calc(12px + var(--sab)) calc(10px + var(--sal)); pointer-events: none; }
  body.touch #touch { display: flex; }
  .pad { display: flex; gap: 10px; align-items: flex-end; pointer-events: none; }
  .tb { pointer-events: auto; width: 76px; height: 76px; border-radius: 18px; background: var(--btn); border: 2px solid rgba(255,255,255,.35);
    color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .tb.big { font-size: 30px; }
  .tb.down { background: var(--btn-on); border-color: var(--accent); }
  #bGas.hidden { display: none; }
  #tune { position: fixed; z-index: 4; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: var(--panel-solid);
    transform: translateX(105%); transition: transform .2s; display: flex; flex-direction: column;
    padding: calc(10px + var(--sat)) calc(12px + var(--sar)) calc(10px + var(--sab)) 12px; touch-action: pan-y; }
  #tune.open { transform: none; }
  #tune header { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #tune header b { flex: 1; font-size: 16px; }
  #sliders { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-right: 4px; }
  #sliders h4 { margin: 12px 0 4px; color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .sl { margin: 6px 0 10px; }
  .sl .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .sl .lab span:last-child { font-variant-numeric: tabular-nums; color: var(--accent2); white-space: nowrap; }
  .sl .lab.changed span:first-child::after { content: " •"; color: var(--accent); }
  .sl input { width: 100%; height: 28px; accent-color: var(--accent); touch-action: pan-x; }
  #copyOut { width: 100%; height: 64px; margin-top: 8px; font: 11px/1.3 ui-monospace, monospace; background: #0d1117; color: var(--text); border: 1px solid #333; border-radius: 6px; -webkit-user-select: text; user-select: text; touch-action: auto; }
  #desc { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  #toast { position: fixed; z-index: 5; left: 50%; top: 40%; transform: translateX(-50%); background: var(--panel-solid); padding: 10px 16px; border-radius: 10px; display: none; }
  #help { position: fixed; z-index: 2; bottom: calc(8px + var(--sab)); left: calc(8px + var(--sal)); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
  body.touch #help { display: none; }
  @media (max-width: 520px) { #speed { font-size: 24px; } #hudL { min-width: 120px; padding: 6px 9px; font-size: 12px; } .tb { width: 66px; height: 66px; } #bar { max-width: 55vw; } #bar select, #bar button { padding: 4px 6px; min-height: 30px; font-size: 12px; } }
  @media (max-height: 430px) { .tb { width: 62px; height: 62px; } #hudL { font-size: 12px; } #speed { font-size: 22px; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="hudL" class="hud">
  <div id="speed">0 <small>km/h</small></div>
  <div class="row"><span>Lap</span><span id="lapT">–</span></div>
  <div class="row"><span>Last</span><span id="lastT">–</span></div>
  <div class="row"><span>Best</span><span id="bestT">–</span></div>
  <div class="row"><span>Slip</span><span id="slip">0°</span></div>
  <div id="slipbar"><div id="slipfill"></div></div>
  <span id="driftTag">DRIFT</span><span id="offTag">OFF ROAD</span>
</div>
<div id="bar">
  <select id="preset" aria-label="Handling preset"></select>
  <select id="surface" aria-label="Surface">
    <option value="hardpack">Hardpack 1.08</option>
    <option value="gravel" selected>Gravel 1.0</option>
    <option value="wet">Wet 0.85</option>
    <option value="snow">Snow 0.72</option>
  </select>
  <button id="auto" aria-pressed="false">Auto-gas</button>
  <button id="cam">Cam</button>
  <button id="reset">Reset</button>
  <button id="tuneBtn">Tune</button>
</div>
<div id="touch">
  <div class="pad">
    <div class="tb big" id="bLeft">◀</div>
    <div class="tb big" id="bRight">▶</div>
  </div>
  <div class="pad">
    <div class="tb" id="bHand">HAND</div>
    <div class="tb" id="bBrake">BRAKE</div>
    <div class="tb" id="bGas">GAS</div>
  </div>
</div>
<div id="help">Arrows / WASD drive · Space handbrake · R reset · C camera · T tune</div>
<aside id="tune" aria-label="Tuning panel">
  <header>
    <b>Tuning</b>
    <button id="resetP">Reset to preset</button>
    <button id="copyP">Copy settings</button>
    <button id="closeT">Close</button>
  </header>
  <p id="desc"></p>
  <div id="sliders"></div>
  <textarea id="copyOut" readonly aria-label="Settings JSON"></textarea>
</aside>
<div id="toast"></div>
<script type="module" src="./lab.js"></script>
</body>
</html>
